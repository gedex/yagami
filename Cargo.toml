[package]
name = "yagami"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/gedex/yagami"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.22"
quick-xml = "0.37"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
url = "2.5"
dashmap = "6.1"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
